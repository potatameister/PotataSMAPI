name: Build PotataSMAPI Native APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # --- SMAPI already built and in assets folder ---
    # Skip SMAPI build - using pre-built StardewModdingAPI.dll from assets
    # --- End SMAPI Build ---

    # Build Android APK using Native Kotlin
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PotataSMAPI-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
