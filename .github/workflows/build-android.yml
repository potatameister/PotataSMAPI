name: Build PotataSMAPI Native APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install build tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_HOME/build-tools/34.0.0/zipalign --version || echo "zipalign not in build-tools"
        echo "Installing apksigner if needed..."

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug --stacktrace

    - name: Verify APK
      run: |
        ls -lh android/app/build/outputs/apk/debug/
        unzip -l android/app/build/outputs/apk/debug/app-debug.apk | head -20

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PotataSMAPI-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
